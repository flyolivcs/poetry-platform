<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 古诗词学习平台</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo"><span class="icon">📜</span> 古诗词学习平台</div>
        <div class="nav-links">
            <a href="/">首页</a>
            <a href="/category">全部诗词</a>
        </div>
        <div class="user-area" id="user-area"></div>
    </nav>

    <div class="auth-form">
        <h2>用户注册</h2>
        <div class="form-group">
            <label>用户名</label>
            <input type="text" id="username" placeholder="请输入用户名（至少2个字符）">
        </div>
        <div class="form-group">
            <label>密码</label>
            <input type="password" id="password" placeholder="请输入密码（至少6个字符）">
        </div>
        <div class="form-group">
            <label>确认密码</label>
            <input type="password" id="password2" placeholder="请再次输入密码">
        </div>
        <button class="btn-submit" onclick="doRegister()">注 册</button>
        <div class="form-footer">
            已有账号？<a href="/login">立即登录</a>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
    <script>
        renderNavbar();

        async function doRegister() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const password2 = document.getElementById('password2').value.trim();
            if (username.length < 2) { showToast('用户名至少2个字符'); return; }
            if (password.length < 6) { showToast('密码至少6个字符'); return; }
            if (password !== password2) { showToast('两次密码不一致'); return; }
            const data = await API.register(username, password);
            if (data.error) { showToast(data.error); return; }
            API.setToken(data.token);
            showToast('注册成功！');
            setTimeout(() => location.href = '/', 1000);
        }

        document.getElementById('password2').addEventListener('keydown', e => {
            if (e.key === 'Enter') doRegister();
        });
    </script>
</body>
</html>
